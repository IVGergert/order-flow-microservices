upstream auth_frontend {
    server auth-frontend:80;
}

upstream order_frontend {
    server order-frontend:80;
}

upstream delivery_frontend {
    server delivery-frontend:80;
}

upstream auth_service {
    server auth-service:8084;
}

upstream order_service {
    server order-service:8081;
}

upstream payment_service {
    server payment-service:8082;
}

upstream delivery_service {
    server delivery-service:8083;
}

upstream minio {
    server minio:9000;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 10m;

    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header Authorization $http_authorization;

    # frontend

    location / {
        proxy_pass http://auth_frontend;
    }

    location = /customer {
        return 301 /customer/;
    }

    location /customer/ {
        proxy_pass http://order_frontend/;
    }

    location = /courier {
        return 301 /courier/;
    }

    location /courier/ {
        proxy_pass http://delivery_frontend/;
    }

    # auth-service

    location = /api/auth {
        proxy_pass http://auth_service;
    }

    location /api/auth/ {
        proxy_pass http://auth_service;
    }

    # order-service

    location = /api/orders {
        proxy_pass http://order_service;
    }

    location /api/orders/ {
        proxy_pass http://order_service;
    }

    location = /api/menu {
        proxy_pass http://order_service;
    }

    location /api/menu/ {
        proxy_pass http://order_service;
    }

    # payment-service

    location = /api/payments {
        proxy_pass http://payment_service;
    }

    location /api/payments/ {
        proxy_pass http://payment_service;
    }

    # delivery-service

    location = /api/deliveries {
        proxy_pass http://delivery_service;
    }

    location /api/deliveries/ {
        proxy_pass http://delivery_service;
    }

    # minio

    location /menu-images/ {
        proxy_pass http://minio/menu-images/;
    }
}