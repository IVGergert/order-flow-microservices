server:
  port: 8083

spring:
  application:
    name: delivery-service

  datasource:
    url: ${DELIVERY_DB_URL}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS}

    producer:
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        acks: all
        retries: 3

    consumer:
      group-id: delivery-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.gergert.common.dto.kafka"

kafka:
  topics:
    order-paid-events: "order-paid-topic"
    delivery-assigned-events: "delivery-assigned-topic"
    order-picked-up-events: "order-picked-up-topic"
    delivery-completed-events: "delivery-completed-topic"

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

logging:
  level:
    org.springframework.kafka.listener.KafkaMessageListenerContainer: Warn

jwt:
  secret: ${JWT_SECRET}