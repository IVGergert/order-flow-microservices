server:
  port: 8081

spring:
  application:
    name: order-service

  datasource:
    url: ${ORDER_DB_URL}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

payment-service:
  base-url: http://localhost:8082